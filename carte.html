<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Carte GPX</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-gpx@1.7.0/dist/leaflet-gpx.min.js"></script>
<style>
  #map { width: 100%; height: 600px; }
</style>
</head>
<body>

<div id="map"></div>

<script>
var map = L.map('map').setView([48.55, 2.9], 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

var traceUrl = "https://webrandomontereau-cloud.github.io/GPX-rando/arbres-remarquables-du-secteur-de-la-mare-a-piat-u5HdxmgvFz.xml";

new L.GPX(traceUrl, { async: true })
  .on('loaded', function(e) {
    map.fitBounds(e.target.getBounds());
  })
  .addTo(map);
</script>

</body>
</html>
